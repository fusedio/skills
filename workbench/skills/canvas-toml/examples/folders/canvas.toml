type = "canvas"
version = 2
name = "Folder layout example"

[canvas]
edges = [
  ["controls", "load_cities"],
  ["load_cities", "city_stats"],
  ["city_stats", "cities_map"],
  ["city_stats", "stats_chart"],
  ["city_stats", "report"],
]

[[canvas.nodes]]
udfName = "intro"
title = "Intro"
x = 0
y = 0
zIndex = 1
width = 350
height = 250
textBoxColor = "#FFF2CC"

[[canvas.nodes]]
udfName = "controls"
title = "Controls"
description = "Pick a region and a minimum population."
visible = true
x = 425
y = 0
zIndex = 2
width = 700
height = 500
nodeDescriptionScaleFactor = 1.5

[[canvas.nodes]]
udfName = "Data"
type = "udf-folder"
folderName = "Data"
folderColor = "#9370DB40"
childUdfOrder = ["load_cities", "city_stats"]
x = 0
y = 618.5
zIndex = 0
width = 1555
height = 690

[[canvas.nodes]]
udfName = "load_cities"
title = "Load cities"
description = "Hidden loader. Cached for one hour so the analysis node can re-run cheaply when the controls change."
visible = false
x = 40
y = 75
zIndex = 3
width = 700
height = 500
nodeDescriptionScaleFactor = 1.5

[[canvas.nodes]]
udfName = "city_stats"
title = "City stats"
description = "Filters by region and population."
visible = true
x = 815
y = 75
zIndex = 4
width = 700
height = 500
nodeDescriptionScaleFactor = 1.5

[[canvas.nodes]]
udfName = "Views"
type = "udf-folder"
folderName = "Views"
folderColor = "#4682B440"
childUdfOrder = ["stats_chart", "report"]
x = 0
y = 1383.5
zIndex = 0
width = 1580
height = 1290

[[canvas.nodes]]
udfName = "Maps"
type = "udf-folder"
folderName = "Maps"
folderColor = "#2E8B5740"
childUdfOrder = ["cities_map"]
x = 0
y = 2748.5
zIndex = 0
width = 980
height = 715

[[canvas.nodes]]
udfName = "cities_map"
title = "Cities map"
visible = true
x = 40
y = 75
zIndex = 5
width = 900
height = 600

[[canvas.nodes]]
udfName = "stats_chart"
title = "Stats chart"
visible = true
x = 40
y = 75
zIndex = 6
width = 700
height = 500

[[canvas.nodes]]
udfName = "report"
title = "Report"
visible = true
x = 40
y = 650
zIndex = 7
width = 800
height = 600
